[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speculators-dashboard"
version = "0.1.0"
description = "Automated eval pipeline and dashboard for speculative-decoding draft models"
readme = "README.md"
requires-python = ">=3.11"
# Runtime code is stdlib-only (see pipeline/). Dev tooling lives in the
# dev extra: pip install -e ".[dev]"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
